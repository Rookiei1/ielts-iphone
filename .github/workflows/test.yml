name: Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ielts-iphone-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Web, WebKit, and Native iPhone Tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Reject secret-shaped or private data files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(\.(p8|p12|mobileprovision|cer|pem|env)$|^private-data/)'; then
            echo "Refusing to test a tree that contains key, profile, or private-data files."
            exit 1
          fi

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          else
            XCODE_APP="$(ls -d /Applications/Xcode_26*.app /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)"
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Set up Node and build Capacitor web assets
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies and run unit & web build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm test
          npx cap sync ios

      - name: Run Playwright browser end-to-end test
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install chromium webkit
          npm run test:browser
          TEST_BROWSER=webkit npm run test:browser

      - name: Set up Ruby and release script checks
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Check release tooling scripts
        shell: bash
        run: |
          set -euo pipefail
          ruby -c fastlane/Fastfile
          ruby -c ci/signing_identity.rb
          bundle exec ruby ci/test_profile_certificates.rb
          python3 ci/test_release_plists.py

      - name: Test the app in real iOS WKWebViews
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs build/native-screenshots
          bundle exec ruby ci/add_ui_tests.rb
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme AppMobileUITests
          xcrun simctl list devices available -j > build/devices.json
          python3 - <<'PYDEV' > build/ui-device-ids.txt
          import json
          data = json.load(open('build/devices.json'))
          devices = [d for group in data['devices'].values() for d in group if d.get('isAvailable') and 'iPhone' in d.get('name','')]
          compact = sorted(devices, key=lambda d: (0 if '16e' in d['name'] else 1 if 'Max' not in d['name'] else 2, d['name']))[0]
          large = next((d for d in devices if 'Max' in d['name'] and d['udid'] != compact['udid']), None)
          for device in [compact, large]:
              if device: print(device['udid'])
          PYDEV
          INDEX=0
          while IFS= read -r DEVICE_ID; do
            INDEX=$((INDEX + 1))
            xcrun simctl boot "$DEVICE_ID" || true
            TEST_STATUS=0
            xcodebuild test -project ios/App/App.xcodeproj -scheme AppMobileUITests -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build/DerivedData -resultBundlePath "build/MobileUI-$INDEX.xcresult" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > "build/logs/ui-$INDEX.log" 2>&1 || TEST_STATUS=$?
            xcrun xcresulttool export attachments --path "build/MobileUI-$INDEX.xcresult" --output-path "build/native-screenshots/device-$INDEX" || true
            if [ "$TEST_STATUS" -ne 0 ]; then
              tail -n 100 "build/logs/ui-$INDEX.log"
              exit "$TEST_STATUS"
            fi
          done < build/ui-device-ids.txt

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iphone-browser-screenshots
          path: |
            docs/screenshots
            build/native-screenshots
            build/logs
            build/MobileUI-*.xcresult
          if-no-files-found: ignore
